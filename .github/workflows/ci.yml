name: CI

on:
  push:
  pull_request:

jobs:
  v2-gate:
    name: Stocker V2 runtime gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Verify Stocker V2 runtime, import, deployment, and web boundaries
        run: |
          uv run ruff format --check \
            packages/stocker_runtime/src/stocker_runtime \
            packages/stocker_research/src/stocker_research/legacy_prospective \
            packages/stocker_research/src/stocker_research/m1c_opening_market_transition_v1.py \
            packages/stocker_research/src/stocker_research/m1c_signed_market_shock_transition_v1.py \
            packages/stocker_research/src/stocker_research/m1c_tail_phase_v1.py \
            tests/test_stocker_runtime_*.py
          uv run ruff check \
            packages/stocker_runtime/src/stocker_runtime \
            packages/stocker_research/src/stocker_research/legacy_prospective \
            packages/stocker_research/src/stocker_research/m1c_opening_market_transition_v1.py \
            packages/stocker_research/src/stocker_research/m1c_signed_market_shock_transition_v1.py \
            packages/stocker_research/src/stocker_research/m1c_tail_phase_v1.py \
            deploy/scripts \
            tests/test_stocker_runtime_*.py
          uv run mypy --no-incremental \
            packages/stocker_runtime/src/stocker_runtime \
            packages/stocker_research/src/stocker_research/legacy_prospective \
            packages/stocker_research/src/stocker_research/m1c_opening_market_transition_v1.py \
            packages/stocker_research/src/stocker_research/m1c_signed_market_shock_transition_v1.py \
            packages/stocker_research/src/stocker_research/m1c_tail_phase_v1.py
          uv run pytest tests/test_stocker_runtime_*.py
          uv run pytest tests/test_frozen_m1c_recorder_v0.py tests/test_m1c_direction_features_v0.py tests/test_m1c_opening_market_transition_research_v1.py tests/test_m1c_opening_market_transition_v1.py tests/test_m1c_opening_market_transition_v1_artifacts.py tests/test_m1c_signed_market_shock_transition_v1.py tests/test_m1c_signed_market_shock_transition_v1_artifacts.py
          uv run stocker-runtime --help
          node --check --input-type=module < packages/stocker_runtime/src/stocker_runtime/web/static/app.js
          node --test tests/js/test_v2_web_app.mjs

  repository-verification:
    name: Repository verification debt report (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint repository
        id: repository_lint
        run: uv run ruff check .

      - name: Type check repository
        id: repository_types
        if: always()
        run: uv run mypy packages apps

      - name: Test repository
        id: repository_tests
        if: always()
        run: uv run pytest

      - name: Summarize repository verification debt
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.repository_lint.outcome }}
          TYPE_OUTCOME: ${{ steps.repository_types.outcome }}
          TEST_OUTCOME: ${{ steps.repository_tests.outcome }}
        run: |
          {
            echo "### Full-repository verification report"
            echo
            echo "- Ruff lint: \`$LINT_OUTCOME\`"
            echo "- mypy: \`$TYPE_OUTCOME\`"
            echo "- pytest: \`$TEST_OUTCOME\`"
            echo
            if [ "$LINT_OUTCOME" = success ] &&
               [ "$TYPE_OUTCOME" = success ] &&
               [ "$TEST_OUTCOME" = success ]; then
              echo "Result: PASS"
            else
              echo "Result: NOT PASSING (explicit inherited-debt report)."
              echo "The blocking Stocker V2 runtime gate is reported separately."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  repository-format-debt:
    name: Repository format debt report (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Report full-repository formatting debt
        id: format
        run: |
          set +e
          uv run ruff format --check . > repository-format-debt.txt 2>&1
          status=$?
          cat repository-format-debt.txt
          if [ "$status" -eq 0 ]; then
            echo "### Repository formatting report: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Repository formatting report: NOT PASSING"
              echo
              echo "This is an explicit, non-blocking inventory of inherited formatting debt."
              echo "It is not represented as a passing repository-wide format check."
              echo "The maintained Stocker V2 gate checks the active runtime and its boundary tests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload formatting debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-format-debt
          path: repository-format-debt.txt
          if-no-files-found: error
