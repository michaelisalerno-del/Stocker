name: CI

on:
  push:
  pull_request:

jobs:
  prospective-gate:
    name: Prospective recorder gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check formatting of changed maintained prospective code
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python scripts/check_prospective_changed_format.py --base "$CI_BASE_SHA"

      - name: Lint prospective recorder
        run: uv run ruff check packages/stocker_prospective/src tests/test_prospective_*.py tests/test_m1c_*.py

      - name: Type check prospective recorder
        run: uv run mypy --no-incremental packages/stocker_prospective/src/stocker_prospective

      - name: Test prospective recorder and M1C segregation
        run: uv run pytest tests/test_prospective_*.py tests/test_m1c_*.py

      - name: Import and CLI smoke test
        run: |
          uv run python -c "import stocker_prospective"
          uv run stocker-prospective --help

      - name: Test dashboard polling concurrency and syntax
        run: |
          node --check --input-type=module < packages/stocker_prospective/src/stocker_prospective/web_static/app.js
          node --check packages/stocker_prospective/src/stocker_prospective/web_static/polling.mjs
          node --test tests/js/test_dashboard_polling.mjs

  repository-verification:
    name: Repository verification debt report (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint repository
        id: repository_lint
        run: uv run ruff check .

      - name: Type check repository
        id: repository_types
        if: always()
        run: uv run mypy packages apps

      - name: Test repository
        id: repository_tests
        if: always()
        run: uv run pytest

      - name: Summarize repository verification debt
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.repository_lint.outcome }}
          TYPE_OUTCOME: ${{ steps.repository_types.outcome }}
          TEST_OUTCOME: ${{ steps.repository_tests.outcome }}
        run: |
          {
            echo "### Full-repository verification report"
            echo
            echo "- Ruff lint: \`$LINT_OUTCOME\`"
            echo "- mypy: \`$TYPE_OUTCOME\`"
            echo "- pytest: \`$TEST_OUTCOME\`"
            echo
            if [ "$LINT_OUTCOME" = success ] &&
               [ "$TYPE_OUTCOME" = success ] &&
               [ "$TEST_OUTCOME" = success ]; then
              echo "Result: PASS"
            else
              echo "Result: NOT PASSING (explicit inherited-debt report)."
              echo "The blocking prospective recorder gate is reported separately."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  repository-format-debt:
    name: Repository format debt report (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Report full-repository formatting debt
        id: format
        run: |
          set +e
          uv run ruff format --check . > repository-format-debt.txt 2>&1
          status=$?
          cat repository-format-debt.txt
          if [ "$status" -eq 0 ]; then
            echo "### Repository formatting report: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Repository formatting report: NOT PASSING"
              echo
              echo "This is an explicit, non-blocking inventory of inherited formatting debt."
              echo "It is not represented as a passing repository-wide format check."
              echo "The maintained prospective gate checks every prospective Python file changed by this revision."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload formatting debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-format-debt
          path: repository-format-debt.txt
          if-no-files-found: error
