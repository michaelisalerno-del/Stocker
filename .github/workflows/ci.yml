name: CI
on:
  push:
  pull_request:
jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, typing, python, frontend, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        if: matrix.check == 'frontend'
        with:
          node-version: "22"
      - name: Install locked development dependencies
        if: matrix.check != 'frontend' && matrix.check != 'server'
        run: uv sync --locked
      - name: Install browser test dependencies
        if: matrix.check == 'frontend'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Server installation and smoke
        if: matrix.check == 'server'
        run: python scripts/server_smoke.py
      - name: Required check
        if: matrix.check != 'server'
        run: bash scripts/check.sh ${{ matrix.check }}
