name: CI
on:
  push:
  pull_request:
jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, typing, python, frontend, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        if: matrix.check == 'frontend'
        with:
          node-version: "22"
      - name: Install locked development dependencies
        if: matrix.check != 'server' && matrix.check != 'frontend'
        run: uv sync --all-groups --locked
      - name: Install browser test dependencies
        if: matrix.check == 'frontend'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Server installation and smoke
        if: matrix.check == 'server'
        run: python scripts/server_smoke.py
      - name: Required check
        if: matrix.check != 'server'
        run: bash scripts/check.sh ${{ matrix.check }}
      - name: Numerical runtime diagnostics
        if: always() && matrix.check == 'python'
        run: |
          uv run --no-sync python -c 'import numpy; numpy.show_runtime(); print(numpy.lib.introspect.opt_func_info(func_name="^log$"))'
          uv run --no-sync python -c 'import stocker_launcher; stocker_launcher.configure_numeric_runtime(); import numpy; numpy.show_runtime(); print(numpy.lib.introspect.opt_func_info(func_name="^log$"))'
