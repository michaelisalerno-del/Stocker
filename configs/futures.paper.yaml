# SLRNO starts disarmed. No legacy provider credentials are required.
data_environment: SAXO_SIM
execution_mode: DISABLED
armed: false
markets: [CL, GC, NG, NQ, SI]
saxo:
  credentials_file: null
  redirect_uri: http://127.0.0.1:8765/oauth/saxo/callback
contracts: {} # Populate only from this environment's returned ContractFutures reference data.
mappings: {} # Real product/expiry adaptation approval remains required.
recorder:
  pre_event_minutes: 15
  minimum_post_event_minutes: 60
  post_close_minutes: 5
  rolling_max_bytes: 33554432
  queue_max_bytes: 8388608
  queue_max_items: 512
  archive_max_bytes: 2147483648
  disk_reserve_bytes: 2147483648
  bar_max_bytes: 134217728
  persistent_capture: false
  recording_permission_evidence: null
