paths:
  database: /var/lib/stocker/prospective/prospective.sqlite3
  bundle_root: /var/lib/stocker/bundles
  context_root: /var/lib/stocker/daily-context
  feature_parity_report: /opt/stocker/current/configs/prospective/feature-parity-m1.json
  # Also supplies the verified anchor identity for record-only diagnostics
  # when serialized scoring artifacts are not yet installed.
  replay_universe: /opt/stocker/current/configs/prospective/anchor-frozen-20.json

runtime:
  # Set both values deliberately before first service start.
  mode: record_only
  source: ibkr
  prospective_start_utc: "2099-01-01T00:00:00Z"
  instance_id: REPLACE-WITH-SERVER-INSTANCE
  app_version: 0.1.0
  git_commit: ${STOCKER_GIT_COMMIT}
  run_id: REPLACE-WITH-PROSPECTIVE-RUN-ID
  recorder_lease_stale_seconds: 60
  heartbeat_seconds: 10

risk:
  trading_enabled: false

web:
  host: 127.0.0.1
  port: 8765
  production: true
  trust_proxy_headers: false
  trusted_proxy_ips: []
  authentication_enabled: false
  auth_token_env: null
  auth_cookie_name: __Host-stocker_session
  auth_cookie_secure: true
  requests_per_minute: 240
  allowed_hosts:
    - 127.0.0.1
    - localhost

ibkr:
  host: 127.0.0.1
  # Frozen internal deployment contract: connect only to the Stocker loopback proxy.
  # The Gateway's separate upstream API socket is never configured here.
  port: 4003
  client_id: 71
  expected_environment: paper
  connect_timeout_seconds: 10
  request_timeout_seconds: 10
  reconnect_max_attempts: 5
  reconnect_backoff_seconds: 2
  market_data_line_budget: 100
  reserved_line_headroom: 10
  request_rate_per_second: 20
  quote_capture_timeout_seconds: 15
  allowed_market_data_types:
    - live
    - frozen
    - delayed
    - delayed_frozen

context:
  mode: signed_import
  hmac_secret_env: STOCKER_CONTEXT_SIGNING_SECRET
  import_directory: /var/lib/stocker/daily-context/incoming

# Append-only after-session EODHD bars for IBKR/EODHD source-parity evidence.
# These observations are always marked ineligible for scoring.
parallel_validation:
  enabled: false
  provider: eodhd
  api_token_env: EODHD_API_TOKEN
  credential_status_env: STOCKER_EODHD_TOKEN_CONFIGURED
  base_url: https://eodhd.com/api
  request_timeout_seconds: 30
  max_retries: 3
  capture_delay_seconds: 7200
  requests_per_minute: 20
