personality: open_down_pressure
version: v0
role: short_or_long_blocker
default_expected_direction: -1
base_event_states:
  - failed_open_down_continuation
preferred_horizons: [6, 9, 12, 24]
regime_families:
  - vwap_side
  - opening_mid_side
  - session_open_side
  - compression_x_efficiency
  - opening_mid_x_range
  - time_x_vwap
filter_families:
  - opening_range
  - vwap_distance
  - session_location
  - prior_return
  - recent_structure
  - efficiency
  - range_volatility
  - time
caveat_families:
  - auction_location
  - event_quality
  - time_of_day
  - cross_stock_alignment
  - freshness
minimums:
  train_count: 30
  test_count: 12
  retained_count: 8
  symbol_count: 3
max_single_symbol_share: 0.50
max_single_session_share: 0.20
max_single_month_share: 0.50
