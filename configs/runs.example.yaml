named_universe_snapshot: ../universes/us-listed.csv

universes:
  - universe_id: FTSE_TEST
    name: FTSE test stocks
    members:
      - {symbol: AZN, exchange: SMART, primary_exchange: LSE, currency: GBP}
      - {symbol: SHEL, exchange: SMART, primary_exchange: LSE, currency: GBP}

  - universe_id: CUSTOM
    name: Custom US stock list
    members:
      - {symbol: AMD, exchange: SMART, primary_exchange: NASDAQ, currency: USD}
      - {symbol: PLTR, exchange: SMART, primary_exchange: NASDAQ, currency: USD}

runs:
  - run_id: ftse_morning
    enabled: true
    universe: FTSE_TEST
    strategy: SESSION_HARD_HV
    environment: PAPER
    risk:
      risk_per_trade: 0.001
      max_concurrent_positions: 5
    session:
      start: "08:00"
      end: "11:00"
      timezone: Europe/London
      calendar: XLON

  - run_id: nasdaq_main
    enabled: false
    universe: NASDAQ
    strategy: SESSION_HARD_HV
    environment: PAPER
    screen:
      method: HOT_BY_VOLUME
      max_results: 50
    risk:
      risk_per_trade: 0.001
      max_concurrent_positions: 5
    session:
      start: "09:30"
      end: "16:00"
      timezone: America/New_York
      calendar: XNYS

  - run_id: nasdaq_experiment
    enabled: false
    universe: NASDAQ
    strategy: NEW_IDEA
    environment: PAPER

  - run_id: nyse_experiment
    enabled: false
    universe: NYSE
    strategy: SESSION_HARD_HV
    environment: PAPER

  - run_id: us_all_experiment
    enabled: false
    universe: US_ALL
    strategy: SESSION_HARD_HV
    environment: PAPER

  - run_id: custom_experiment
    enabled: false
    universe: CUSTOM
    strategy: SESSION_HARD_HV
    environment: PAPER
