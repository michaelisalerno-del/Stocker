# LIVE market data with internal paper fills: no broker order can be sent in this mode.
# Use a new ledger for it (for example /var/lib/stocker/v1/saxo-live-internal-paper.sqlite3);
# the store refuses to relabel an existing SIM ledger. See docs/LIVE-PAPER-EXPERIMENT.md.
data_environment: SAXO_LIVE
execution_mode: INTERNAL_PAPER
armed: false
markets: [CL, ES, GC, NQ]
saxo:
  credentials_file: /etc/stocker/v1/saxo.live.credentials.json # mode 0600, environment SAXO_LIVE
  redirect_uri: https://dashboard.example.net/oauth/saxo/callback # must match the LIVE app registration
contracts: {} # Pin from this environment's returned ContractFutures reference data after login.
mappings: {} # Per-market option approvals; see docs/FUTURES-RULEBOOK.md.
# Observation-only chain window: strikes nearest the money, recorded with every capture
# (3-100; the live server runs 61 since 2026-10-04).
option_chain_strikes: 25
recorder:
  minimum_post_event_minutes: 60
  post_close_minutes: 5
  rolling_max_bytes: 67108864 # 64 MiB: the four chain windows share the 15-minute memory
  queue_max_bytes: 8388608
  queue_max_items: 512
  archive_max_bytes: 53687091200 # 50 GiB (at most 80): clocks every session hour record ~0.6-0.9 GB per day
  disk_reserve_bytes: 2147483648
  bar_max_bytes: 134217728
  # Set both together, with the actual permission record (who granted it, when, and its scope):
  # persistent_capture: true
  # recording_permission_evidence: "..."
  persistent_capture: false
  recording_permission_evidence: null
