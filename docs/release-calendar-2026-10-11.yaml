# Scheduled US releases, 2026-10-01 to 2026-11-30, New York time (EDT -04:00 to Nov 1, EST -05:00 after).
# Observation and display context in the app; the calendar of RELEASE-EXIT-PROTOCOL.md (hashed there).
# Compiled 2026-10-01 from the publishers' own calendars:
#   BLS (Employment Situation, CPI, PPI, JOLTS) bls.gov/schedule/2026/home.htm and per-release pages;
#   Census (Retail Sales, New Residential Sales) census.gov/economic-indicators/calendar-listview.html;
#   BEA (GDP, Personal Income & Outlays) bea.gov/news/schedule/full; DOL claims oui.doleta.gov/unemploy/claims_arch.asp;
#   ISM press releases' "next report" lines (PR Newswire); Conference Board consumer-confidence page;
#   University of Michigan release-date list (docid 75443); NAR 2026 statistical release schedule;
#   EIA weekly petroleum and natural gas storage schedules (holiday rows); Federal Reserve 2026 October and
#   November calendars. No federal funding lapse in the window (P.L. 119-103 funds agencies to 2026-12-11).
# Left out: Conference Board on 2026-11-24 (not yet confirmed by the publisher). ISM Services on 2026-11-04 is
# from the third-business-day rule and search extracts of ISM's calendar; ISM's 2026-10-05 release confirms it.
# Markets: macro releases CL/GC/NQ/SI; EIA petroleum CL; EIA gas storage NG; Federal Reserve all five.
