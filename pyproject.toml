[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stocker"
version = "0.1.0"
description = "SLRNO: Saxo futures-options PAPER runtime and its authenticated dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Stocker" }]
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.111",
  "starlette",
  "uvicorn>=0.30",
  "websockets>=15,<17",
]

[project.scripts]
stocker = "stocker_execution.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/stocker_execution/src/stocker_execution",
  "packages/stocker_dashboard/src/stocker_dashboard",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/stocker_execution/src",
  "packages/stocker_dashboard/src",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/stocker_execution/src",
  "packages/stocker_dashboard/src",
  "scripts",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["stocker_execution", "stocker_dashboard"]
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev"]
